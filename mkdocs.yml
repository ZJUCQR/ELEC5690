site_name: 医学影像分析
site_description: 从深度学习基础到医学影像分类、分割、多模态、视网膜、皮肤镜与超声，结合公式、图示和研究案例理解方法。
site_url: https://zjucqr.github.io/ELEC5690/
repo_url: https://github.com/ZJUCQR/ELEC5690
repo_name: ZJUCQR / ELEC5690
copyright: 图示与原始资料 © 原作者 · 仅供学习交流
theme:
  name: material
  language: zh
  font: false
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
plugins:
  - search:
      lang:
        - en
        - zh
hooks:
  - scripts/hooks.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra_css:
  - assets/vendor/katex/katex.min.css
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/vendor/katex/katex.min.js
  - assets/javascripts/site.js
nav:
  - 学习笔记:
    - 首页: index.md
    - 1a · Medical Imaging & AI: notes/01a-introduction.md
    - 1b · Deep Learning Fundamentals: notes/01b-fundamentals.md
    - 2 · Classification: notes/02-classification.md
    - 3 · Segmentation: notes/03-segmentation.md
    - 4 · Training & Retinal Images: notes/04-training-retina.md
    - 5 · Multi-modal Data & Dermoscopy: notes/05-multimodal-dermoscopy.md
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
